bundle:
  name: ecommerce-pipeline-bundle

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-de83ecc2-9f60.cloud.databricks.com

  prod:
    workspace:
      host: https://dbc-de83ecc2-9f60.cloud.databricks.com

resources:
  jobs:
    daily_sales_pipeline_job:
      name: "Ecommerce Sales Pipeline [${bundle.target}]"
      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ./main.py
          environment_key: "default"
      environments:
        - environment_key: "default"
          spec:
            client: "1"
            dependencies:
              - python-dotenv
